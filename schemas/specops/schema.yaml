name: specops
version: 1
description: Full final SpecOps workflow
artifacts:
    - id: exploration
      generates: exploration.md
      description: Evidence-backed exploration
      template: exploration.md
      instruction: Return facts, inferences, constraints, risks, and validation needs.
      requires: []
    - id: proposal
      generates: proposal.md
      description: Bounded proposal
      template: proposal.md
      instruction: Define behavior, non-goals, compatibility, and rollback.
      requires: [exploration]
    - id: specs
      generates: specs/**/*.md
      description: Normative specifications
      template: spec.md
      instruction: Produce testable requirements and scenarios.
      requires: [proposal]
    - id: design
      generates: design.md
      description: Independent technical design
      template: design.md
      instruction: Independently design from persisted exploration, proposal, and specs.
      requires: [exploration, proposal, specs]
    - id: tasks
      generates: tasks.md
      description: Refined implementation tasks
      template: tasks.md
      instruction: Refine tasks only after persisted design.
      requires: [specs, design]
    - id: verification
      generates: verification.md
      description: Registry-backed verification
      template: verification.md
      instruction: Record only controller-registered command evidence.
      requires: [tasks]
    - id: correctness-judgment
      generates: judgment-correctness.json
      description: Independent correctness assurance
      template: judgment-correctness.json
      instruction: Persist a structured correctness judgment for current hashes.
      requires: [verification]
    - id: compliance-judgment
      generates: judgment-compliance.json
      description: Independent specification-compliance assurance
      template: judgment-compliance.json
      instruction: Persist a structured compliance judgment for current hashes.
      requires: [verification]
    - id: review-ledger
      generates: review-ledger.json
      description: Independent review ledger
      template: review-ledger.json
      instruction: Persist refuted findings and selected remediation.
      requires: [correctness-judgment, compliance-judgment]
apply:
    requires: [tasks]
    tracks: tasks.md
    instruction: Implement approved tasks without editing OpenSpec evidence.
