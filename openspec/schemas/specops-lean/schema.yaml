name: specops-lean
version: 1
description: Lean final SpecOps workflow
artifacts:
    - id: exploration
      generates: exploration.md
      description: Evidence-backed focused exploration
      template: ../../specops/templates/exploration.md
      instruction: Return facts, inferences, affected paths, risk facets, and validation needs.
      requires: []
    - id: verification
      generates: verification.md
      description: Registry-backed verification evidence
      template: ../../specops/templates/verification.md
      instruction: Record only commands registered by the deterministic controller.
      requires: [exploration]
    - id: correctness-judgment
      generates: judgment-correctness.json
      description: Independent correctness assurance
      template: ../../specops/templates/judgment-correctness.json
      instruction: Preserve structured correctness evidence for the reviewed hashes.
      requires: [verification]
    - id: review-ledger
      generates: review-ledger.json
      description: Final review ledger
      template: ../../specops/templates/review-ledger.json
      instruction: Persist refuted independent-review findings.
      requires: [correctness-judgment]
apply:
    requires: [exploration]
    tracks: null
    instruction: Implement only approved scope and do not edit evidence artifacts.
