name: specops-standard
version: 1
description: Standard final SpecOps workflow
artifacts:
    - id: exploration
      generates: exploration.md
      description: Evidence-backed exploration
      template: ../../specops/templates/exploration.md
      instruction: Return facts, inferences, constraints, risks, and validation needs.
      requires: []
    - id: proposal
      generates: proposal.md
      description: Bounded behavioral proposal
      template: ../../specops/templates/proposal.md
      instruction: Define outcomes, non-goals, impact, and compatibility.
      requires: [exploration]
    - id: specs
      generates: specs/**/*.md
      description: Normative behavioral deltas
      template: ../../specops/templates/spec.md
      instruction: Produce testable requirements and scenarios.
      requires: [proposal]
    - id: tasks
      generates: tasks.md
      description: Dependency-ordered implementation tasks
      template: ../../specops/templates/tasks.md
      instruction: Produce tasks from persisted proposal and specs.
      requires: [specs]
    - id: verification
      generates: verification.md
      description: Registry-backed verification evidence
      template: ../../specops/templates/verification.md
      instruction: Record only controller-registered command evidence.
      requires: [tasks]
    - id: correctness-judgment
      generates: judgment-correctness.json
      description: Independent correctness assurance
      template: ../../specops/templates/judgment-correctness.json
      instruction: Persist a structured correctness judgment for current hashes.
      requires: [verification]
    - id: compliance-judgment
      generates: judgment-compliance.json
      description: Independent specification-compliance assurance
      template: ../../specops/templates/judgment-compliance.json
      instruction: Persist a structured compliance judgment for current hashes.
      requires: [verification]
    - id: review-ledger
      generates: review-ledger.json
      description: Independent review ledger
      template: ../../specops/templates/review-ledger.json
      instruction: Persist refuted findings and selected remediation.
      requires: [correctness-judgment, compliance-judgment]
apply:
    requires: [tasks]
    tracks: tasks.md
    instruction: Implement approved tasks without modifying evidence artifacts.
