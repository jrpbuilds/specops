name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Ensure npm Trusted Publishing support
              run: |
                  npm install --global npm@^11.15.0
                  node --version
                  npm --version

            - name: Install dependencies
              run: npm ci

            - name: Run checks
              run: npm run check

            # Trusted Publishing is configured via the package settings on npmjs.com.
            # Publishing uses OIDC (id-token: write) and npm provenance; no NPM_TOKEN secret is required.
            - name: Publish to npm
              run: npm publish --provenance --access public

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
